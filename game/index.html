<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Let's Eat!</title>
    <link rel="icon" href="data:," />
    <style>
      /* Page = the game's dark brown (C.bg), so the side bars match the game. */
      html, body { margin: 0; height: 100%; overflow: hidden; background: #2e2624; }
      /* Phaser's CENTER_BOTH centres the canvas in #game; no CSS centring too,
         or the offset is applied twice and the bars come out uneven. */
      #game { width: 100%; height: 100%; }
      #game canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
